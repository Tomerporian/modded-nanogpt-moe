job_details:
  name: large_scale_baseline
  output_dir: /e/scratch/reformo/shechter1/checkpoints/modded-nanogpt-moe/

parameters:
  LIST_DATASETS:
    # - input_bin: ["data/fineweb10B/fineweb_train_*.bin"]
    #   input_val_bin: ["data/fineweb10B/fineweb_train_*.bin"]
    # - input_bin: ["data/tokenized_owt2/train.bin"]
    #   input_val_bin: ["data/tokenized_owt2/val.bin"]
    - input_bin: ["/e/data1/datasets/products/mmlaion/language/tokenized/C4/GPT-NeoX/merged"]
      input_val_bin: ["/e/data1/datasets/products/mmlaion/language/tokenized/C4/GPT-NeoX/merged"]

  # Model parameters
  vocab_size: [50304]
  n_layer: [12]
  n_head: [6] # change to 12?
  n_embd: [768]
  # router_type: ['switch', 'diff']

  # Optimization parameters
  batch_size: [1024]  # 8*64
  device_batch_size: [32]  # was 16
  sequence_length: [1024]
  num_iterations: [23800] # was 4578 before
  warmup_iters: [0]
  warmdown_iters: [5000] # was 1308 before
  weight_decay: [0.0]
  use_adamw_opt3: [false]
  # Learning rate parameters
  lr_embed: [0.3]
  lr_head: [0.002]
  lr_muon: [0.02]
  momentum: [0.95]

  # Evaluation and logging parameters
  val_loss_every: [150]
  val_tokens: [10485760]
  save_every: [150]
  save_only_latest: [true]
  wandb_project: ["modded-nanogpt-moe"]
  output: ["logs"]

  # Run config
  # device_0: [true]
  seed: [1000]

  router_type: ['switch']
  aux_use_routed_prob: [false]
  global_load_balance: [false]
  load_balance_loss: ['maxvio']
  load_balance_ste_width: [1.0]
  aux_coeff_train: [0.001]
  aux_coeff_val: [0.001]

  top_k: [8]
  num_experts: [256]
  hidden_dim_scale_factor: [0.5]
