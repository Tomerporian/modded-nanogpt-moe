job_details:
  name: min-totalvio_lb_sweep
  output_dir: logs/seeds_and_datasets

parameters:
  LIST_DATASETS:
    # - input_bin: ["data/fineweb10B/fineweb_train_*.bin"]
    #   input_val_bin: ["data/fineweb10B/fineweb_train_*.bin"]
    # - input_bin: ["data/tokenized_owt2/train.bin"]
    #   input_val_bin: ["data/tokenized_owt2/val.bin"]
    - input_bin: ["/p/data1/mmlaion/text-data/tokenized/c4/merged"]
      input_val_bin: ["/p/data1/mmlaion/text-data/tokenized/c4/merged"]

  # Model parameters
  vocab_size: [50304]
  n_layer: [12]
  n_head: [6] # change to 12?
  n_embd: [768]
  # router_type: ['switch', 'diff']

  # Optimization parameters
  batch_size: [512]  # 8*64
  device_batch_size: [8]  # was 16
  sequence_length: [1024]
  num_iterations: [6000] # was 4578 before
  warmup_iters: [0]
  warmdown_iters: [1714] # was 1308 before
  weight_decay: [0.0]
  use_adamw_opt3: [false]
  # Learning rate parameters
  lr_embed: [0.3]
  lr_head: [0.002]
  lr_muon: [0.02]
  momentum: [0.95]

  # Evaluation and logging parameters
  val_loss_every: [125]
  val_tokens: [10485760]
  save_every: [200]
  save_only_latest: [true]
  wandb_project: ["modded-nanogpt-moe"]
  output: ["logs"]

  # Run config
  device_0: [true]
  seed: [1000]

  LIST_AUX_COEFF:
    - aux_coeff_train: [0.0001]
      aux_coeff_val: [0.0001]
    - aux_coeff_train: [0.00001]
      aux_coeff_val: [0.00001]

  router_type: ['switch']
  aux_use_routed_prob: [false]
  load_balance_ste_width: [1.0, 5.0, 10.0]
  global_load_balance: [false]

  LIST_LB:
    - maxvio_load_balance: [false]
      minmaxvio_load_balance: [false]
      totalvio_load_balance: [true]
      rect_ste_threshold: ['topk', 'topk_plus_one', 'midpoint']
      top_k: [2]
    - maxvio_load_balance: [false]
      minmaxvio_load_balance: [true]
      totalvio_load_balance: [false]
      rect_ste_threshold: ['topk', 'topk_plus_one', 'midpoint']
      top_k: [2]

  num_experts: [64]
  hidden_dim_scale_factor: [0.5]
