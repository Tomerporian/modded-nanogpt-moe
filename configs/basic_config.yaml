job_details:
  name: diff_no_softmax-muon_clip-wd01
  output_dir: /data/mikey/exps/full/
parameters:
  input_bin: ["/data/mikey/fineweb10B/fineweb_train_*.bin"]
  input_val_bin: ["/data/mikey/fineweb10B/fineweb_val_000000.bin"]

  # Model parameters
  vocab_size: [50304]
  n_layer: [12]
  n_head: [6] # change to 12?
  n_embd: [768]

  # Optimization parameters
  batch_size: [128]  # 8*64
  device_batch_size: [16]  # was 16 
  sequence_length: [1024]
  num_iterations: [6000] # was 4578 before. # 6000 for tomer
  warmup_iters: [0]
  warmdown_iters: [1714] # was 1308 before. # 1714 for tomer
  weight_decay: [0.1]
  use_adamw_opt3: [false]
  # Learning rate parameters
  lr_embed: [0.3]
  lr_head: [0.002]
  lr_muon: [0.02]
  momentum: [0.95]

  # Evaluation and logging parameters
  val_loss_every: [125]
  val_tokens: [5242880] # 5242880 = 10485760 / 2
  save_every: [200]
  wandb_project: ["modded-nanogpt-moe"]
  output: ["logs"]

  # Run config
  device_0: [false]
  seed: [1000]
  # use_adamw_router: [true]
  
  global_load_balance: [true]
  aux_coeff_train: [0.1]
  aux_coeff_val: [0.1]

  router_type: ['diff_no_softmax']
  aux_use_routed_prob: [true]
  num_experts: [64]
  top_k: [16]
  hidden_dim_scale_factor: [0.5]
  use_muon_clip: [true]

  # diff_topk_regularizer_max_coeff: [0.0001, 0.001]
  # diff_topk_regularizer_schedule: ['cosine', 'constant']
  # use_router_temperature: [false]


